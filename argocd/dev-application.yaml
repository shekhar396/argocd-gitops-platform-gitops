apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-platform-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/shekhar396/argocd-gitops-platform-gitops.git
    targetRevision: HEAD
    path: overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true